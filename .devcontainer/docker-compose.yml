services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    volumes:
      # Mount the entire workspace
      - ..:/workspace:cached

      # Mount Go module cache for faster builds
      - go-modules:/go/pkg/mod

      # Mount command history
      - command-history:/commandhistory

      # NOTE: host ~/.claude and ~/.dotfiles are deliberately NOT bind-mounted.
      # Writable host binds let the container corrupt host config with
      # container-absolute paths, and a read-only bind of all of ~/.claude would
      # still expose .credentials.json and session transcripts. The local,
      # gitignored docker-compose.override.yml mounts an allowlisted subset
      # read-only at /host-seed and local-seed.sh copies it into container-local
      # named volumes. See docker-compose.override.yml.example.

      # NOTE: Host config mounts (~/.gitconfig, ~/.ssh) moved to
      # docker-compose.override.yml. Copy docker-compose.override.yml.example
      # to docker-compose.override.yml to enable them.

    # Keep container running
    command: sleep infinity

    # Environment variables (loaded from .env in root)
    env_file:
      - ../.env

    environment:
      # Development-specific overrides
      LOG_LEVEL: debug
      LOG_JSON: "false"
      DATABASE_URL: postgresql://slabledger:slabledger@postgres:5432/slabledger?sslmode=disable

      # OAuth redirect for local development
      EBAY_REDIRECT_URI: http://localhost:8081/auth/ebay/callback
      EBAY_OAUTH_ENV: sandbox

      # Development secrets - CHANGE THESE for local development
      # These are intentionally invalid placeholders. Set real values in .env
      SESSION_SECRET: CHANGE-ME-dev-session-secret
      ENCRYPTION_KEY: CHANGE-ME-dev-encryption-key-32b

    # Network
    networks:
      - dev_network

    depends_on:
      postgres:
        condition: service_healthy

    # Ports
    ports:
      - "8081:8081"      # Application
      - "2345:2345"      # Delve debugger
      - "6060:6060"      # pprof profiling (if enabled)

    # Resource limits (adjust as needed)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '4'
    #       memory: 8G

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: slabledger
      POSTGRES_PASSWORD: slabledger
      POSTGRES_DB: slabledger
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - dev_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slabledger -d slabledger"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  go-modules:
  command-history:
  pgdata:

networks:
  dev_network:
    driver: bridge
