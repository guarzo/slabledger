name: Frontend CI

# Deliberately no workflow-level `paths:` filter. A filtered-out workflow posts no
# check runs at all, so a required check from it would sit "Expected" forever and
# block the PR. Path filtering moved to the `changes` job below: a skipped job still
# posts a check run, and GitHub counts skipped as passing.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Replaces the old workflow-level path filter. Runs on every PR so the gate below
    # always reports, but keeps the expensive jobs off PRs that touch no frontend code.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.result.outputs.web }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Detect frontend changes
      # PR-only: this path uses the GitHub API and needs no git history. On pushes to
      # main the action would fall back to a git diff against github.event.before,
      # which is unreliable on a shallow checkout.
      uses: dorny/paths-filter@v4
      if: github.event_name == 'pull_request'
      id: filter
      with:
        # No '!' exclusions here. In dorny/paths-filter these are picomatch
        # negations OR'd with the other patterns, not exclusions like GitHub's
        # native `paths:` -- '!web/*.md' matches every path that ISN'T web/*.md,
        # so it made the filter true for every change. Markdown-only edits under
        # web/ therefore run the frontend suite; that costs a few minutes and is
        # the safe direction to err.
        filters: |
          web:
            - 'web/**'
            - '.github/workflows/frontend-ci.yml'

    - name: Resolve result
      # Pushes to main deploy to production, so main gets the full suite unfiltered.
      id: result
      env:
        IS_PR: ${{ github.event_name == 'pull_request' }}
        PR_HAS_WEB: ${{ steps.filter.outputs.web }}
      run: |
        if [ "$IS_PR" = "true" ]; then
          echo "web=$PR_HAS_WEB" >> "$GITHUB_OUTPUT"
        else
          echo "web=true" >> "$GITHUB_OUTPUT"
        fi

  frontend:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./web

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Type Check
      run: npm run typecheck

    - name: Run linter
      run: npm run lint

    - name: Run Unit Tests
      run: npm test

    - name: Build
      run: npm run build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: web-dist
        path: web/dist/
        retention-days: 1

    - name: Install Lighthouse CI
      run: npm install -g @lhci/cli@0.15.x

    # Lighthouse CI is expensive, only run on main branch or when requested
    - name: Run Lighthouse CI
      if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'lighthouse')
      run: lhci autorun
      continue-on-error: true
      env:
        LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

    - name: Upload Lighthouse results
      uses: actions/upload-artifact@v7
      if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'lighthouse')
      with:
        name: lighthouse-results
        path: web/.lighthouseci/
        retention-days: 7

  smoke-tests:
    # Fast smoke tests for quick feedback (~30-60 seconds)
    # Tests critical paths only (tagged with @smoke)
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./web

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Download build artifacts
      uses: actions/download-artifact@v8
      with:
        name: web-dist
        path: web/dist/

    - name: Cache Playwright browsers
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('web/package-lock.json') }}
        restore-keys: ${{ runner.os }}-playwright-chromium-

    - name: Install Playwright Chromium
      run: npx playwright install chromium --with-deps

    - name: Start preview server
      run: |
        npm run preview > preview-server.log 2>&1 &
        echo $! > preview-server.pid
      env:
        CI: true

    - name: Wait for server
      run: npx wait-on http://localhost:4173 --timeout 90000

    - name: Run smoke tests only
      run: npx playwright test --grep @smoke
      timeout-minutes: 5
      env:
        CI: true
        SMOKE_ONLY: true

    - name: Upload smoke test results
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: smoke-test-results
        path: web/playwright-report/
        retention-days: 7

    - name: Cleanup preview server
      if: always()
      run: |
        if [ -f preview-server.pid ]; then
          PID=$(cat preview-server.pid)
          kill -TERM -$PID 2>/dev/null || true
          sleep 2
          kill -KILL -$PID 2>/dev/null || true
          rm -f preview-server.pid
        fi

  playwright:
    # Full E2E test suite (runs only if smoke tests pass)
    needs: smoke-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./web

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Download build artifacts
      uses: actions/download-artifact@v8
      with:
        name: web-dist
        path: web/dist/

    - name: Cache Playwright browsers
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('web/package-lock.json') }}
        restore-keys: ${{ runner.os }}-playwright-chromium-

    - name: Install Playwright Chromium (fast)
      run: npx playwright install chromium --with-deps

    - name: Start preview server
      run: |
        npm run preview > preview-server.log 2>&1 &
        echo $! > preview-server.pid
        echo "Preview server started with PID: $(cat preview-server.pid)"
      env:
        CI: true

    - name: Wait for server
      run: npx wait-on http://localhost:4173 --timeout 90000

    - name: Run Playwright tests
      run: npx playwright test
      timeout-minutes: 15
      env:
        CI: true

    - name: Upload test results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: playwright-report
        path: web/playwright-report/
        retention-days: 7

    - name: Upload test videos
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: playwright-videos
        path: web/test-results/
        retention-days: 7

    - name: Cleanup preview server
      if: always()
      run: |
        if [ -f preview-server.pid ]; then
          PID=$(cat preview-server.pid)
          echo "Stopping preview server (PID: $PID)"
          kill -TERM -$PID 2>/dev/null || true
          sleep 2
          kill -KILL -$PID 2>/dev/null || true
          rm -f preview-server.pid
          echo "Preview server cleanup complete"
        else
          echo "No PID file found, server may not have started"
        fi

    - name: Upload preview server logs
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: preview-server-logs
        path: web/preview-server.log
        retention-days: 7

  frontend-checks:
    # The single required status check for frontend CI in branch protection.
    #
    # `if: always()` makes it report on every PR, including ones where the jobs above
    # skipped — that is the whole point, since a required check that never reports
    # blocks the PR permanently. Requiring this one job instead of the three
    # underlying ones also means adding or renaming a frontend job never desyncs the
    # branch protection config.
    needs: [changes, frontend, smoke-tests, playwright]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
    - name: Fail if any frontend job failed
      # Skipped and successful both count as passing; only failure/cancellation gate.
      if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
      run: |
        echo "changes:     ${{ needs.changes.result }}"
        echo "frontend:    ${{ needs.frontend.result }}"
        echo "smoke-tests: ${{ needs['smoke-tests'].result }}"
        echo "playwright:  ${{ needs.playwright.result }}"
        exit 1

    - name: Report result
      run: echo "Frontend checks passed or were skipped for this change."
