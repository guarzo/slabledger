name: Dependabot auto-merge

# Turns on GitHub's native auto-merge for Dependabot PRs. This does NOT merge
# anything directly — it only arms auto-merge, and branch protection still holds the
# PR until every required check passes. A red build leaves the PR open for a human.
#
# `pull_request_target` is required: Dependabot PRs run with a read-only GITHUB_TOKEN
# under `pull_request`, which cannot enable auto-merge. The usual pull_request_target
# hazard is running untrusted PR code with write scope — this job never checks out the
# PR, so there is nothing to exploit.

on:
  pull_request_target:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Fetch update metadata
      # Reads the semver bump type off the PR without checking out its code.
      id: meta
      uses: dependabot/fetch-metadata@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Enable auto-merge
      # Squash matches the repo's only permitted merge method.
      #
      # Majors are excluded deliberately. Of the last 60 Dependabot PRs, 46 merged and
      # 7 were closed by hand (Dependabot's "I won't notify you again about this
      # release" reply) — roughly one real decision in eight was "no", and the two that
      # cost the most to undo were majors (eslint 9->10, react). Majors now stay open
      # for a human, which is what already happened in practice.
      if: steps.meta.outputs.update-type != 'version-update:semver-major'
      run: gh pr merge --auto --squash "$PR_URL"
      env:
        PR_URL: ${{ github.event.pull_request.html_url }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
